<div class="mb-6 flex flex-wrap items-end justify-between gap-3 border-b border-white/[0.07]">
  <nav class="flex items-center gap-1" aria-label="Minecraft-Statistikbereiche">
    <a href="{{ url_for('minecraft_statistics_page', dimension=selected_dimension|default('OVERWORLD')) }}"
      class="border-b-2 px-3 py-2.5 text-xs font-medium transition {{ 'border-cyan-400 text-cyan-300' if statistics_tab == 'overview' else 'border-transparent text-slate-500 hover:text-white' }}">Spielerdaten</a>
    <a href="{{ url_for('minecraft_server_performance_page', dimension=selected_dimension|default('OVERWORLD')) }}"
      class="border-b-2 px-3 py-2.5 text-xs font-medium transition {{ 'border-cyan-400 text-cyan-300' if statistics_tab == 'server' else 'border-transparent text-slate-500 hover:text-white' }}">Serverleistung</a>
  </nav>
  {% if statistics_tab == 'overview' %}
  <div class="mb-1.5 flex items-center gap-2">
    <span class="hidden text-[10px] font-medium uppercase tracking-wider text-slate-500 sm:inline">Dimension</span>
    <div class="inline-flex rounded-md border border-white/10 bg-[#0a0f1a] p-0.5" aria-label="Dimension auswählen">
      {% for dimension, label in dimension_options.items() %}
      <a href="{{ url_for('minecraft_statistics_page', dimension=dimension) }}" aria-current="{{ 'page' if selected_dimension == dimension else 'false' }}"
        class="rounded px-3 py-1.5 text-[11px] font-medium transition {{ 'bg-cyan-500/15 text-cyan-300' if selected_dimension == dimension else 'text-slate-400 hover:bg-white/[0.05] hover:text-white' }}">{{ label }}</a>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</div>

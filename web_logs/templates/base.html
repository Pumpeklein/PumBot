<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "PumBot Ticket Logs" }}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">PB</div>
          <div class="brand-text">
            <div class="brand-title">PumBot Ticket Logs</div>
            <div class="brand-subtitle">
              Moderation, Tickets und Transkripte in einer Oberfläche
            </div>
          </div>
        </div>

        <nav class="nav">
          {% if username %}
          <span class="pill">{{ username }} · {{ role }}</span>
          <a class="nav-link" href="{{ url_for('tickets_page') }}">Tickets</a>
          {% if role == "owner" %}
          <a class="nav-link" href="{{ url_for('admin_users') }}">Benutzer</a>
          {% endif %}
          <a class="nav-link-danger" href="{{ url_for('logout') }}">Logout</a>
          {% else %}
          <a class="nav-link" href="{{ url_for('login') }}">Login</a>
          {% endif %}
        </nav>
      </header>

      <main class="page">
        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %} {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>

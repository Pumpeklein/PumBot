{% extends "base.html" %}
{% block content %}
<h1>Login</h1>
<form method="post" class="card">
  <label>Username</label>
  <input name="username" required>

  <label>Passwort</label>
  <input name="password" type="password" required>

  <button type="submit">Einloggen</button>
</form>
{% endblock %}
